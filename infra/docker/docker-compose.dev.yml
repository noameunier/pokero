name: pokero-dev

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokero
      POSTGRES_PASSWORD: pokero_dev_only
      POSTGRES_DB: pokero
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pokero_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokero -d pokero"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pokero_dev_db:
